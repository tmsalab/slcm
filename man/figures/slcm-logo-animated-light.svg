<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600" role="img" aria-labelledby="slcmlTitle slcmlDesc">
<title id="slcmlTitle">slcm</title>
<desc id="slcmlDesc">Hexagonal logo for the R package slcm. The word slcm is set large across the lower half, ranged left, under a solid axis line that runs the full width of the hex. On that line stands a broad solid bell, the normal slab of a spike-and-slab prior, centred exactly on the letter l, its left tail running off the left edge. The l is orange: one stroke that rises from the baseline through the axis line, straight through the bell, and out through the top edge of the hex. It is the spike, a point mass at exactly zero. A faint dot grid rules the plate above the axis. In the animated version the bell sinks into the axis line until only the orange spike stands, the coefficient set to exactly zero, and then rises again.</desc>
<defs>
<clipPath id="slcmlClip"><path d="M260 5 L515 152.5 L515 447.5 L260 595 L5 447.5 L5 152.5 Z"/></clipPath>
</defs>
<style>
@keyframes slcmlChoose {
  0%, 30% { transform: scaleY(1); animation-timing-function: cubic-bezier(.5, 0, .75, 0); }
  40%, 56% { transform: scaleY(0); animation-timing-function: cubic-bezier(.2, .7, .3, 1); }
  76%, 100% { transform: scaleY(1); }
}
.slcmlSlab { transform-origin: 0px 320.37px; animation: slcmlChoose 8s infinite; }
@media (prefers-reduced-motion: reduce) {
  .slcmlSlab { animation: none; }
}
</style>
